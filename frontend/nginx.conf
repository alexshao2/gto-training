# nginx config inside the frontend container.
# - /api/ws/  → backend WebSocket (Upgrade headers)
# - /api/    → backend HTTP
# - /tg/     → bot service (Telegram webhook). PUBLIC_URL of the bot must end
#              with /tg so it constructs `${PUBLIC_URL}/webhook/${SECRET}` →
#              `<domain>/tg/webhook/<secret>` which we strip to `/webhook/...`
#              when proxying.
# - everything else → SPA index.html (history mode fallback).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long timeouts so coach LLM/TTS streams (~10-20s) don't get cut.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 4m;

    # WebSocket route — must come BEFORE the generic /api/ block.
    location /api/ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WS sessions can be long
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram bot webhook. Strips /tg prefix → bot sees /webhook/<secret>.
    location /tg/ {
        proxy_pass http://bot:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with long cache.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
