[project]
name = "poker-gto-coach-bot"
version = "0.1.0"
description = "Telegram bot wrapper that launches the Poker GTO Coach MiniApp."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
